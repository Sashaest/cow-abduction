name: Android build (AAB + APK)

on:
  workflow_dispatch:      # solo manuale: nessun minuto consumato a ogni push
  push:
    tags: ['v*']          # oppure creando un tag di release (es. v1.0.1)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        # (cache Gradle per build più rapide)
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Android SDK già presente sui runner ubuntu-latest (ANDROID_HOME)

      - name: Install deps & sync web assets
        run: |
          npm ci
          npx cap sync android

      - name: Decode upload keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; echo "::warning::Nessun keystore: genero solo l'APK di test (debug)"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK di test (debug, senza keystore)
        if: steps.ks.outputs.signed != 'true'
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}-test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache assembleDebug

      - name: Build signed AAB + APK
        if: steps.ks.outputs.signed == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: cow-abduction-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
