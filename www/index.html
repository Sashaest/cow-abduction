<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Cow Abduction - Night Highway</title>
<!--
  COW ABDUCTION - NIGHT HIGHWAY
  ==============================================================
  Endless/level runner arcade 3D (Three.js) per web + Android (Capacitor).
  Sezioni del codice:
   1. CONFIG & DATI DI GIOCO      (costanti, settori, upgrade, skin, trofei, sfide)
   2. SALVATAGGIO                 (localStorage, cuori, laboratorio idle)
   3. AUDIO PROCEDURALE           (Web Audio API: raggio, moo, crash, musica synthwave)
   4. THREE.JS SETUP & MONDO      (renderer, luci, strada, lampioni, alberi, meteo)
   5. MODELLI 3D                  (UFO + skin, mucche, veicoli, meteore)
   6. LOOP DI GIOCO               (spawn, abduction, collisioni, close call, panic fever)
   7. UI / SCHERMATE              (menu, mappa, laboratorio, trofei, classifica, game over)
   8. INPUT & MAIN LOOP           (tastiera, touch/swipe, back Android, rAF)
-->
<style>
/* =====================================================================
   STILE UI NEON-ARCADE
   ===================================================================== */
:root{
  --neon:#00ff88; --cyan:#22e6ff; --pink:#ff2bd6; --gold:#ffd23f; --red:#ff3355;
  --bg:rgba(7,9,24,.9); --line:rgba(0,255,136,.35);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#02030a;color:#e8fbff;
  font-family:"Trebuchet MS",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
.layer{position:fixed;inset:0;pointer-events:none}
.hidden{display:none!important}
.title-font{font-family:"Arial Black","Trebuchet MS",sans-serif;letter-spacing:.06em}

/* --- Effetti schermo --- */
#flash{background:#fff;opacity:0;z-index:5;mix-blend-mode:screen}
#dmg{background:radial-gradient(ellipse at center,rgba(255,0,40,0) 40%,rgba(255,0,40,.65) 100%);opacity:0;z-index:6}
#vignette{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(34,230,255,.35) 100%);opacity:0;z-index:6;transition:opacity .15s}
#panicTint{background:radial-gradient(ellipse at center,rgba(255,0,40,0) 50%,rgba(255,0,60,.35) 100%);opacity:0;z-index:6;transition:opacity .4s}
body.glitch #game{animation:glitch .25s steps(2) 6}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-6px,2px);filter:hue-rotate(90deg)}50%{transform:translate(5px,-3px)}75%{transform:translate(-2px,4px);filter:hue-rotate(-90deg)}100%{transform:translate(0)}}

/* --- HUD --- */
#hud{z-index:10;padding:calc(10px + var(--safe-t)) 12px 0}
.hud-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hud-row>div{flex:none}
.hud-row>div.mid{flex:1;min-width:0}
#hudLeft{min-width:96px;white-space:nowrap}
.hud-box{background:rgba(5,8,20,.55);border:1px solid var(--line);border-radius:12px;padding:6px 10px;
  box-shadow:0 0 12px rgba(0,255,136,.15);backdrop-filter:blur(3px)}
.hud-big{font-size:22px;font-weight:900;color:#fff;text-shadow:0 0 10px var(--cyan)}
.hud-small{font-size:12px;opacity:.85}
#hudCows{color:var(--neon);font-weight:900;font-size:18px;text-shadow:0 0 8px var(--neon)}
#hudMult{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:8px;background:var(--pink);color:#fff;font-weight:900;font-size:14px;box-shadow:0 0 12px var(--pink)}
#hudLives{font-size:18px;white-space:nowrap;color:var(--red);text-shadow:0 0 8px var(--red);text-align:right}
#hudShields{font-size:14px;color:var(--cyan);text-align:right;min-height:18px}
#progressWrap{margin:8px auto 0;width:100%;max-width:420px;height:8px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;border:1px solid rgba(255,255,255,.15)}
#progressBar{height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--cyan));box-shadow:0 0 10px var(--neon)}
#hudGoal{text-align:center;font-size:12px;margin-top:3px;opacity:.9}
#banner{position:fixed;left:50%;top:calc(110px + var(--safe-t));transform:translateX(-50%);font-weight:900;font-size:20px;
  padding:6px 16px;border-radius:12px;width:max-content;max-width:92vw;opacity:0;transition:opacity .3s;z-index:11;text-align:center}
#banner.show{opacity:1}
#banner.panic{background:rgba(255,0,50,.25);border:1px solid var(--red);color:#fff;text-shadow:0 0 12px var(--red);animation:pulse .5s infinite alternate}
#banner.info{background:rgba(34,230,255,.15);border:1px solid var(--cyan);color:#fff;text-shadow:0 0 10px var(--cyan)}
@keyframes pulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.07)}}
#beamUI{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);width:200px;z-index:11;opacity:0;transition:opacity .15s;text-align:center}
#beamUI.show{opacity:1}
#beamBarWrap{height:10px;border-radius:6px;background:rgba(0,0,0,.5);border:1px solid var(--neon);overflow:hidden}
#beamBar{height:100%;width:0;background:var(--neon);box-shadow:0 0 12px var(--neon)}
#beamLabel{font-size:12px;font-weight:900;color:var(--neon);text-shadow:0 0 8px var(--neon);margin-bottom:3px}
#beamUses{position:fixed;right:14px;bottom:calc(150px + var(--safe-b));z-index:11;font-weight:900;color:var(--neon)}
#popups{position:fixed;inset:0;z-index:12;pointer-events:none;overflow:hidden}
.pop{position:absolute;left:50%;transform:translate(-50%,0);font-weight:900;white-space:nowrap;animation:popUp 1.1s ease-out forwards;
  text-shadow:0 0 12px currentColor}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
#pauseBtn{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(5,8,20,.6);color:#fff;font-size:18px;margin-top:6px;float:right}
#countdown{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:900;color:#fff;
  text-shadow:0 0 30px var(--neon);z-index:13;pointer-events:none}

/* --- Controlli touch --- */
#touch{position:fixed;left:0;right:0;bottom:0;z-index:12;display:none;justify-content:space-between;align-items:flex-end;
  padding:0 14px calc(16px + var(--safe-b));pointer-events:none}
body.touch #touch.on{display:flex}
.tbtn{pointer-events:auto;width:78px;height:78px;border-radius:50%;border:2px solid var(--cyan);background:rgba(34,230,255,.12);
  color:#fff;font-size:32px;font-weight:900;box-shadow:0 0 16px rgba(34,230,255,.4);display:flex;align-items:center;justify-content:center}
.tbtn:active,.tbtn.down{background:rgba(34,230,255,.35)}
#tAbduct{width:118px;height:118px;border-color:var(--neon);background:rgba(0,255,136,.14);box-shadow:0 0 22px rgba(0,255,136,.5);font-size:15px;letter-spacing:.05em}
#tAbduct.down{background:rgba(0,255,136,.45)}

/* --- Schermate / pannelli --- */
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;pointer-events:auto;
  background:radial-gradient(ellipse at 50% 30%,rgba(10,30,40,.35),rgba(2,3,10,.82));padding:calc(10px + var(--safe-t)) 10px calc(10px + var(--safe-b))}
.screen.active{display:flex}
.screen.clear{background:rgba(2,3,10,.35)}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:18px;width:min(560px,96vw);max-height:100%;overflow:auto;
  box-shadow:0 0 30px rgba(0,255,136,.18),inset 0 0 40px rgba(34,230,255,.06);touch-action:pan-y}
.panel h1,.panel h2{margin:0 0 10px;text-align:center}
.panel h2{font-size:22px;color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
.logo{font-size:clamp(30px,9vw,52px);line-height:1;text-align:center;color:#fff;text-shadow:0 0 12px var(--neon),0 0 30px var(--neon);margin:4px 0}
.logo small{display:block;font-size:.38em;color:var(--pink);text-shadow:0 0 10px var(--pink);letter-spacing:.3em;margin-top:6px}
.btn{display:block;width:100%;margin:8px 0;padding:13px 14px;border-radius:14px;border:1px solid var(--neon);background:linear-gradient(180deg,rgba(0,255,136,.18),rgba(0,255,136,.05));
  color:#fff;font-size:16px;font-weight:800;letter-spacing:.04em;cursor:pointer;text-shadow:0 0 8px rgba(0,255,136,.8);box-shadow:0 0 14px rgba(0,255,136,.2);font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.alt{border-color:var(--cyan);background:linear-gradient(180deg,rgba(34,230,255,.16),rgba(34,230,255,.04));text-shadow:0 0 8px rgba(34,230,255,.8)}
.btn.pink{border-color:var(--pink);background:linear-gradient(180deg,rgba(255,43,214,.2),rgba(255,43,214,.05));text-shadow:0 0 8px rgba(255,43,214,.8)}
.btn.gold{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,210,63,.22),rgba(255,210,63,.05));text-shadow:0 0 8px rgba(255,210,63,.8)}
.btn.ghost{border-color:rgba(255,255,255,.3);background:transparent;text-shadow:none}
.btn:disabled{opacity:.4;filter:grayscale(1)}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:13px;margin:4px 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:6px 0 10px;font-size:14px}
.stat b{color:var(--gold);text-shadow:0 0 8px var(--gold)}
.card{border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;margin:8px 0;background:rgba(255,255,255,.03)}
.card.done{border-color:var(--neon);box-shadow:0 0 10px rgba(0,255,136,.25)}
.card.locked{opacity:.45}
.card h3{margin:0 0 4px;font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{opacity:.7;font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;padding:9px 4px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;font-weight:800;font-family:inherit;font-size:13px}
.tab.on{border-color:var(--cyan);background:rgba(34,230,255,.18);box-shadow:0 0 10px rgba(34,230,255,.3)}
.pips{display:inline-flex;gap:3px}
.pip{width:12px;height:6px;border-radius:2px;background:rgba(255,255,255,.18)}
.pip.on{background:var(--neon);box-shadow:0 0 6px var(--neon)}
.fence{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0}
.pen{height:34px;border-radius:6px;border:1px dashed rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden}
.pen.full{border-style:solid;border-color:var(--neon);background:rgba(0,255,136,.12)}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvl{padding:9px 0;border-radius:10px;border:1px solid var(--cyan);background:rgba(34,230,255,.1);color:#fff;font-weight:900;font-family:inherit;font-size:14px}
.lvl.done{border-color:var(--neon);background:rgba(0,255,136,.18)}
.lvl:disabled{opacity:.3}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left}
th{color:var(--cyan)}
input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--cyan);background:rgba(0,0,0,.4);color:#fff;font-size:15px;font-family:inherit}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:900;background:rgba(255,255,255,.12)}
.badge.ok{background:var(--neon);color:#002}
.badge.gold{background:var(--gold);color:#210}
#topbar{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:6px;font-size:15px}
#toasts{position:fixed;left:50%;top:calc(12px + var(--safe-t));transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:min(420px,92vw)}
.toast{background:rgba(8,10,28,.95);border:1px solid var(--gold);border-radius:12px;padding:9px 12px;box-shadow:0 0 18px rgba(255,210,63,.35);
  animation:toastIn 3.2s ease forwards;font-size:14px}
@keyframes toastIn{0%{opacity:0;transform:translateY(-20px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#02030a;z-index:100;color:var(--neon);font-weight:900}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<body>
<div id="loading"><div class="logo title-font">COW ABDUCTION<small>NIGHT HIGHWAY</small></div><p>Caricamento…</p></div>
<div id="game"></div>
<div id="flash" class="layer"></div>
<div id="dmg" class="layer"></div>
<div id="vignette" class="layer"></div>
<div id="panicTint" class="layer"></div>

<!-- HUD di gioco -->
<div id="hud" class="layer hidden">
  <div class="hud-row">
    <div class="hud-box" id="hudLeft">
      <div class="hud-big" id="hudScore">0</div>
      <div><span id="hudCows">🐄 0</span><span id="hudMult" class="hidden">x1</span></div>
    </div>
    <div class="mid">
      <div id="progressWrap"><div id="progressBar"></div></div>
      <div id="hudGoal"></div>
    </div>
    <div>
      <div class="hud-box">
        <div id="hudLives">♥♥♥</div>
        <div id="hudShields"></div>
      </div>
      <button id="pauseBtn" data-act="pause" aria-label="Pausa">❚❚</button>
    </div>
  </div>
</div>
<div id="banner"></div>
<div id="beamUI"><div id="beamLabel">ABDUCTION</div><div id="beamBarWrap"><div id="beamBar"></div></div></div>

<!-- Controlli touch (mobile) -->

</div>

<!-- Schermate (contenuto generato via JS) -->
<div class="screen" id="scr-menu"><div class="panel" id="pnl-menu"></div></div>
<div class="screen" id="scr-map"><div class="panel" id="pnl-map"></div></div>
<div class="screen" id="scr-lab"><div class="panel" id="pnl-lab"></div></div>
<div class="screen" id="scr-trophies"><div class="panel" id="pnl-trophies"></div></div>
<div class="screen" id="scr-leader"><div class="panel" id="pnl-leader"></div></div>
<div class="screen" id="scr-daily"><div class="panel" id="pnl-daily"></div></div>
<div class="screen" id="scr-settings"><div class="panel" id="pnl-settings"></div></div>
<div class="screen clear" id="scr-pause"><div class="panel" id="pnl-pause"></div></div>
<div class="screen" id="scr-over"><div class="panel" id="pnl-over"></div></div>
<div class="screen" id="scr-modal"><div class="panel" id="pnl-modal"></div></div>

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   1. CONFIG & DATI DI GIOCO
   ===================================================================== */
const CFG = {
  LANES: [-3, 0, 3],
  SPAWN_Z: -160,
  DESPAWN_Z: 18,
  UFO_Y_CRUISE: 3.6,     // in crociera: le auto passano sotto, i camion/rocce no
  UFO_Y_BEAM: 2.0,       // in picchiata (raggio attivo): tutto ciò che passa colpisce
  BASE_ABDUCT_TIME: 1.5, // secondi di raggio per rapire una mucca
  LOCK_SLOW: 0.4,        // velocità mondo durante l'aggancio (−60%)
  START_LIVES: 3,
  MAX_HEARTS: 5,
  HEART_RECHARGE_MS: 15 * 60 * 1000,
  HEARTS_ENABLED: false, // si riattiva insieme agli annunci reali (AdService)
  IAP_ENABLED: false,    // si riattiva con Play Billing
  GOLDEN_CHANCE: 0.10,
  PANIC_DURATION: 30,
  CLOSE_CALL_SLOWMO: 0.55,
  MAX_MULT: 5,
  LAB_RATE_PER_MIN: 10,  // monete/minuto per Mucca Dorata nel laboratorio
  CROSSBREED_COST: 150,
};

/* Settori della Mappa della Base Aliena: 5 livelli ciascuno */
const SECTORS = [
  { name: 'Praterie Terrestri',      icon: '🌾', skin: 'retro',  passive: '+10% Bio-Mucca Coins',      weather: ['clear', 'clear', 'fog'] },
  { name: 'Laboratorio Genetico',    icon: '🧬', skin: 'gold',   passive: 'Raggio +10% più veloce',     weather: ['clear', 'fog', 'storm'] },
  { name: 'Area Saggi',              icon: '📜', skin: 'cube',   passive: '+1 Scudo a inizio partita',  weather: ['fog', 'storm', 'meteor'] },
  { name: 'Sala Trono della Regina', icon: '👑', skin: 'queen',  passive: '+5% probabilità Mucca Dorata', weather: ['storm', 'meteor', 'fog'] },
  { name: 'Portale Dimensionale',    icon: '🌀', skin: 'prism',  passive: '+1 Vita iniziale',           weather: ['meteor', 'storm', 'fog', 'clear'] },
];
const LEVELS = [];
for (let s = 0; s < 5; s++) for (let l = 0; l < 5; l++) {
  const i = s * 5 + l;
  LEVELS.push({
    id: i, sector: s, n: l + 1,
    distance: 650 + i * 55,
    speed: 22 + i * 0.75,
    density: 0.85 + i * 0.05,
    target: 6 + Math.floor(i * 0.9),
    cyborg: 0.06 + i * 0.006,
    weather: SECTORS[s].weather[(l * 7 + s * 3) % SECTORS[s].weather.length],
  });
}

const UPGRADES = {
  beam:   { name: 'Velocità del Raggio', icon: '⚡', desc: 'Rapisci le mucche più in fretta (−12% tempo/livello)', costs: [80, 180, 350, 600, 1000] },
  shield: { name: 'Scudo Energetico',    icon: '🛡️', desc: 'Assorbe 1 collisione per livello, senza perdere vite', costs: [150, 450, 1000] },
  hold:   { name: 'Capienza Stiva',      icon: '📦', desc: '+15% monete a fine partita, +1 stalla e silo più grande nel Laboratorio', costs: [100, 250, 500, 900, 1500] },
};

const UFO_SKINS = {
  classic: { name: 'Classico',            body: 0xb8c2d0, dome: 0x66e0ff, led: 0x00ff88, shape: 'disc',  how: 'Base' },
  retro:   { name: "UFO Retrò anni '50",  body: 0xd9d9d9, dome: 0xff4466, led: 0xff3355, shape: 'retro', how: 'Completa Praterie Terrestri' },
  gold:    { name: "Disco d'Oro",         body: 0xffc93a, dome: 0xfff2b0, led: 0xffffff, shape: 'disc',  how: 'Completa Laboratorio Genetico', metal: true },
  cube:    { name: 'Astronave Cubica',    body: 0x2a3240, dome: 0x22e6ff, led: 0x22e6ff, shape: 'cube',  how: 'Completa Area Saggi' },
  queen:   { name: 'Corona della Regina', body: 0x7a3cff, dome: 0xff9bf0, led: 0xff2bd6, shape: 'queen', how: 'Completa Sala Trono della Regina' },
  prism:   { name: 'Prisma Dimensionale', body: 0x20242e, dome: 0xffffff, led: 0xffffff, shape: 'prism', how: 'Completa Portale Dimensionale', rainbow: true },
};

/* Skin delle mucche ottenibili con gli incroci genetici (personaggi originali) */
const COW_SKINS = {
  standard:    { name: 'Frisona Classica', body: 0xf4f4f0, spot: 0x111111, acc: null },
  millionaire: { name: 'Mucca Milionaria', body: 0xf4f4f0, spot: 0x1d6b3a, acc: 'tophat' },
  cyber:       { name: 'Mucca Cyberpunk',  body: 0x1a1030, spot: 0xff2bd6, acc: 'visor', glow: 0x22e6ff },
  zombie:      { name: 'Mucca Zombie',     body: 0x86a86a, spot: 0x3c4a2c, acc: 'bandage' },
  disco:       { name: 'Mucca Disco',      body: 0xd8dde8, spot: 0x8a8fff, acc: 'afro', metal: true },
  astro:       { name: 'Mucca Astronauta', body: 0xffffff, spot: 0x4466aa, acc: 'helmet' },
  pirate:      { name: 'Mucca Pirata',     body: 0xe8dcc8, spot: 0x5a3218, acc: 'pirate' },
  unicorn:     { name: 'Mucca Unicorno',   body: 0xfff4ff, spot: 0xffa6e8, acc: 'horn' },
  mummy:       { name: 'Mucca Mummia',     body: 0xd8cfa8, spot: 0xa89c70, acc: 'bandage' },
};

const ACHIEVEMENTS = [
  { id: 'first',     name: 'Primo Contatto',              desc: 'Rapisci la tua prima mucca',                    reward: 25 },
  { id: 'serial',    name: 'Rapitore Seriale di Mucche',  desc: 'Rapisci 100 mucche in totale',                  reward: 150 },

/* ---------- Utility ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function dateKey(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

    hearts: CFG.MAX_HEARTS, heartsTs: Date.now(), unlimited: false,

}
function deepMerge(base, over) {
  if (!over || typeof over !== 'object') return base;
  for (const k of Object.keys(over)) {
    if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k]) && typeof over[k] === 'object' && !Array.isArray(over[k])) deepMerge(base[k], over[k]);
    else base[k] = over[k];
  }
  return base;
}
function loadSave() {
  try { return deepMerge(defaultSave(), JSON.parse(localStorage.getItem(SAVE_KEY) || 'null')); }
  catch (e) { return defaultSave(); }
}
let S = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage pieno o bloccato */ } }

/* --- Cuori (tentativi globali) --- */
function heartsActive() { return CFG.HEARTS_ENABLED && !S.unlimited; }
function refreshHearts() {
  if (!heartsActive()) return;
  const now = Date.now();
  while (S.hearts < CFG.MAX_HEARTS && now - S.heartsTs >= CFG.HEART_RECHARGE_MS) { S.hearts++; S.heartsTs += CFG.HEART_RECHARGE_MS; }
  if (S.hearts >= CFG.MAX_HEARTS) S.heartsTs = now;
}
function consumeHeart() {
  if (!heartsActive()) return;
  refreshHearts();
  if (S.hearts >= CFG.MAX_HEARTS) S.heartsTs = Date.now();
  S.hearts = Math.max(0, S.hearts - 1); persist();
}
function nextHeartMs() { return Math.max(0, CFG.HEART_RECHARGE_MS - (Date.now() - S.heartsTs)); }

/* --- Bonus passivi (upgrade + settori completati) --- */
const sectorDone = (i) => S.sectorsDone.includes(i);
function abductTime() { return CFG.BASE_ABDUCT_TIME * (1 - 0.12 * S.upgrades.beam) * (sectorDone(1) ? 0.9 : 1); }
function startShields() { return S.upgrades.shield + (sectorDone(2) ? 1 : 0); }
function startLives() { return CFG.START_LIVES + (sectorDone(4) ? 1 : 0); }
function coinBonus() { return 1 + 0.15 * S.upgrades.hold + (sectorDone(0) ? 0.10 : 0); }
function goldChanceBonus() { return sectorDone(3) ? 0.05 : 0; }
function labSlots() { return 2 + S.upgrades.hold; }
function siloCap() { return 300 + 200 * S.upgrades.hold; }

/* --- Laboratorio idle: le Mucche Dorate producono monete anche ad app chiusa --- */
function tickLab() {
  const now = Date.now();
  const mins = (now - S.lab.lastTs) / 60000;
  const producers = Math.min(S.goldenStock, labSlots());
  if (producers > 0 && mins > 0) S.lab.silo = Math.min(siloCap(), S.lab.silo + mins * producers * CFG.LAB_RATE_PER_MIN);
  S.lab.lastTs = now;
}

/* --- Missioni giornaliere --- */
function ensureQuests() {
  const dk = dateKey();
  if (S.quests.date === dk) return;
  const r = mulberry32(hashStr('q' + dk));
  const pool = QUEST_POOL.slice(); const ids = [];
  while (ids.length < 3) ids.push(pool.splice((r() * pool.length) | 0, 1)[0].id);
  S.quests = { date: dk, ids, progress: {}, claimed: {} }; persist();
}
function questProgress(id, amount) {
  ensureQuests();
  if (!S.quests.ids.includes(id)) return;
  const q = QUEST_POOL.find(x => x.id === id);
  const before = S.quests.progress[id] || 0;
  S.quests.progress[id] = Math.min(q.goal, before + amount);
  if (before < q.goal && S.quests.progress[id] >= q.goal) toast(`✅ Missione completata: ${q.text} — riscuoti nel menu`);
}
function todayChallenge() { const r = mulberry32(hashStr('d' + dateKey())); return DAILY_CHALLENGES[(r() * DAILY_CHALLENGES.length) | 0]; }

/* --- Trofei --- */
function unlock(id) {
  if (S.achievements[id]) return;
  const a = ACHIEVEMENTS.find(x => x.id === id); if (!a) return;
  S.achievements[id] = Date.now(); S.coins += a.reward; persist();
  toast(`🏆 <b>${a.name}</b> — +${a.reward} 🪙`); Audio.powerup();
}

/* =====================================================================

   ===================================================================== */
const Audio = (() => {
  let ctx = null, master, sfxBus, musicBus, noiseBuf;
  let beamNodes = null;

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }

    ctx = new AC();

    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ctx.destination);

  function apply() { if (!ctx) return; musicBus.gain.value = S.settings.music ? 0.3 : 0; sfxBus.gain.value = S.settings.sfx ? 0.9 : 0; }
  function env(g, t, a, peak, dec) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); }

  }

  /* Ronzio del raggio: oscillatori persistenti con frequenza variabile in base al progresso */
  function buildBeam() {
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), lfo = ctx.createOscillator();
    const f = ctx.createBiquadFilter(), g = ctx.createGain(), lg = ctx.createGain();

    f.type = 'lowpass'; f.frequency.value = 600; f.Q.value = 8;
    lfo.frequency.value = 7; lg.gain.value = 250; lfo.connect(lg); lg.connect(f.frequency);
    g.gain.value = 0; o1.connect(f); o2.connect(f); f.connect(g); g.connect(sfxBus);
    o1.start(); o2.start(); lfo.start();
    beamNodes = { o1, o2, f, g, lfo };
  }
  function beam(active, progress) {
    if (!ctx || !beamNodes) return;
    const t = ctx.currentTime, b = beamNodes;
    b.g.gain.setTargetAtTime(active ? 0.13 : 0, t, 0.05);
    b.o1.frequency.setTargetAtTime(70 + progress * 170, t, 0.06);
    b.o2.frequency.setTargetAtTime(140 + progress * 340, t, 0.06);
    b.f.frequency.setTargetAtTime(500 + progress * 2200, t, 0.06);
    b.lfo.frequency.setTargetAtTime(6 + progress * 12, t, 0.1);
  }
  /* "Moo" acuto: dente di sega con glide + filtro formante + vibrato */
  function moo(kind = 'std') {
    if (!ctx) return; const t = ctx.currentTime;
    const base = kind === 'gold' ? 520 : kind === 'bull' ? 180 : 360;
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain(), v = ctx.createOscillator(), vg = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(base * 1.25, t); o.frequency.exponentialRampToValueAtTime(base, t + 0.15);

    v.frequency.value = 9; vg.gain.value = 12; v.connect(vg); vg.connect(o.frequency);
    f.type = 'bandpass'; f.frequency.setValueAtTime(800, t); f.frequency.linearRampToValueAtTime(1300, t + 0.6); f.Q.value = 3;
    env(g, t, 0.04, 0.35, 0.65); o.connect(f); f.connect(g); g.connect(sfxBus);
    o.start(t); v.start(t); o.stop(t + 0.8); v.stop(t + 0.8);
    if (kind === 'gold') { [0, 0.08, 0.16].forEach((d, i) => tone('triangle', 1046 * Math.pow(1.26, i), 0.15, 0.12, sfxBus, t + 0.3 + d)); }

    env(g, t, 0.01, 0.35, 0.35); n.connect(bp); bp.connect(g); g.connect(sfxBus); n.start(t); n.stop(t + 0.4);

  function impact() { if (!ctx) return; const t = ctx.currentTime; tone('sine', 140, 0.6, 0.6, sfxBus, t, 30); const n = noiseSrc(), lp = ctx.createBiquadFilter(), g = ctx.createGain(); lp.type = 'lowpass'; lp.frequency.value = 1400; env(g, t, 0.005, 0.5, 0.5); n.connect(lp); lp.connect(g); g.connect(sfxBus); n.start(t); n.stop(t + 0.6); }
  function whoosh() { if (!ctx) return; const t = ctx.currentTime; const n = noiseSrc(), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = 'bandpass'; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(1800, t + 0.25); env(g, t, 0.02, 0.12, 0.25); n.connect(f); f.connect(g); g.connect(sfxBus); n.start(t); n.stop(t + 0.3); }

  /* --- Musica synthwave 8-bit: sequencer a 16 step con lookahead --- */
  const PROG = [ // accordi (midi) e basso: Am - F - C - G
    { bass: 45, chord: [57, 60, 64] }, { bass: 41, chord: [53, 57, 60] },
    { bass: 48, chord: [55, 60, 64] }, { bass: 43, chord: [55, 59, 62] },

  const LEAD = [76, null, 72, null, 74, 76, null, 79, null, 76, null, 74, 72, null, 69, null];

    mus.timer = setInterval(schedule, 25);
  }
  function setPanicMusic(p) { mus.panic = p; mus.bpm = p ? 142 : 112; }
  function schedule() {
    if (!ctx || ctx.state !== 'running') return;
    const stepDur = 60 / mus.bpm / 4;
    while (mus.next < ctx.currentTime + 0.12) { playStep(mus.step, mus.next, stepDur); mus.next += stepDur; mus.step = (mus.step + 1) % 256; }
  }
  function playStep(step, t, sd) {
    const bar = Math.floor(step / 16) % 4, s = step % 16, ch = PROG[bar];
    const dest = musicBus;
    // Cassa / rullante / charleston
    if (s % 4 === 0) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12); env(g, t, 0.002, 0.9, 0.18); o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.25); }
    if (s === 4 || s === 12) { const n = noiseSrc(), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = 'highpass'; f.frequency.value = 1500; env(g, t, 0.002, 0.35, 0.13); n.connect(f); f.connect(g); g.connect(dest); n.start(t); n.stop(t + 0.16); }
    if (s % 2 === 1 || mus.panic) { const n = noiseSrc(), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = 'highpass'; f.frequency.value = 7000; env(g, t, 0.001, 0.1, 0.03); n.connect(f); f.connect(g); g.connect(dest); n.start(t); n.stop(t + 0.05); }
    // Basso in ottavi
    if (s % 2 === 0) { const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain(); o.type = 'sawtooth'; o.frequency.value = mtof(ch.bass + (s % 4 === 2 ? 12 : 0)); f.type = 'lowpass'; f.frequency.value = 700; env(g, t, 0.005, 0.32, sd * 1.6); o.connect(f); f.connect(g); g.connect(dest); o.start(t); o.stop(t + sd * 2); }

    { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.value = mtof(ch.chord[s % 3] + 12); env(g, t, 0.003, 0.045, sd * 0.8); o.connect(g); g.connect(dest); o.start(t); o.stop(t + sd); }

const laneX = (i) => CFG.LANES[i];

function laneBlockedTimes(excludeTall = true) { // tempi di arrivo dei veicoli alti per corsia
  const res = [[], [], []];
  for (const v of vehicles) { if (!v.tall || v.z > 0) continue; const rs = Math.max(4, relSpeed(v)); res[v.lane].push(-v.z / rs); }
  return res;
}
function spawnVehicle() {
  if (G.weather === 'meteor') { spawnRoadMeteor(); return; }
  let kind;
  const r = Math.random();
  if (G.mods.rush) kind = r < 0.72 ? 'truck' : 'car';
  else kind = r < 0.58 ? 'car' : r < 0.83 ? 'truck' : 'tractor';
  let oncoming = kind === 'tractor' ? false : G.mods.rush ? Math.random() < 0.2 : Math.random() < 0.6;
  const own = kind === 'tractor' ? rand(2, 4) : G.mods.rush && !oncoming ? rand(2, 5) : oncoming ? (kind === 'car' ? rand(10, 18) : rand(7, 12)) : (kind === 'car' ? rand(4, 9) : rand(3, 6));
  const dir = oncoming ? 1 : -1;
  const tall = kind === 'truck';
  const lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
  let lane = -1;
  const times = laneBlockedTimes();
  const rs = Math.max(4, G.scrollSpeed + dir * own);
  const myT = -CFG.SPAWN_Z / rs;
  for (const L of lanes) {
    // niente sovrapposizioni con un veicolo appena generato nella stessa corsia
    if (vehicles.some(v => v.lane === L && v.z < CFG.SPAWN_Z + 22)) continue;
    if (tall) { // equità: non bloccare mai tutte e 3 le corsie nello stesso istante
      const blocked = [0, 1, 2].filter(k => k === L || times[k].some(t => Math.abs(t - myT) < 1.3));
      if (blocked.length >= 3) continue;
    }
    lane = L; break;
  }
  if (lane < 0) return;
  const b = buildVehicle(kind, oncoming);
  const v = { ...b, kind, lane, x: laneX(lane), z: CFG.SPAWN_Z, own, dir, tall, prevZ: CFG.SPAWN_Z, hit: false, t: Math.random() * 10 };
  v.group.position.set(v.x, 0, v.z); scene.add(v.group); vehicles.push(v);
}

}

  let type = 'std';
  const r = Math.random();
  if (G.mods.bulls && r < 0.5) type = 'bull';
  else if (r < G.goldChance) type = 'golden';
  else if (r < G.goldChance + G.cyborgChance) type = 'cyborg';
  const free = [0, 1, 2].filter(L => !vehicles.some(v => v.lane === L && v.z < CFG.SPAWN_Z + 25));
  const lane = pick(free.length ? free : [0, 1, 2]);
  const b = buildCow(type);
  const c = { ...b, type, lane, x: laneX(lane) + rand(-0.3, 0.3), z: fromSky ? rand(-75, -35) : CFG.SPAWN_Z, y: fromSky ? rand(18, 26) : 0, vy: 0,
    state: fromSky ? 'fall' : type === 'bull' ? 'charge' : 'idle', prog: 0, t: Math.random() * 10, rotY: type === 'bull' ? 0 : rand(-2.5, 2.5), scale: 0.92, hopX: 0 };
  c.group.rotation.y = c.rotY; c.group.position.set(c.x, c.y, c.z); scene.add(c.group); cows.push(c);
}

/* ---------- Danno e collisioni ---------- */
function releaseLock() { if (G.locked) { G.locked.state = 'fall'; G.locked.vy = 0; G.locked = null; } }
function damage(source) {
  if (G.invulnT > 0 || G.state !== 'playing') return;
  releaseLock();
  if (G.shields > 0) {
    G.shields--; G.invulnT = 1.2; shieldBubble.material.opacity = 0.7; Audio.shieldHit(); vibrate(40);
    popup('🛡️ SCUDO!', '#22e6ff', 40); updateHUD(true); return;
  }
  G.lives--; G.damageTaken = true; G.mult = 1; G.invulnT = 1.8; G.shake = 0.7;
  source === 'lightning' ? Audio.thunder() : source === 'meteor' ? Audio.impact() : Audio.crash();
  vibrate([60, 40, 120]); flashDOM('dmg', 1, 0.6);
  updateHUD(true);
  if (G.lives <= 0) gameOver();
}
function aabbHit(v) {
  const dx = Math.abs(v.x - G.ufoX), dz = Math.abs(v.z);
  const zOv = dz < v.len / 2 + 1.0;
  if (!zOv) return false;
  const bodyHit = dx < v.w / 2 + 1.1 && v.h > G.ufoY - 0.45;                 // scafo dell'UFO
  const beamHit = G.beamOn && dx < v.w / 2 + 0.75;                          // il raggio tocca il veicolo
  return bodyHit || beamHit;
}
function closeCall(v) {
  G.mult = Math.min(CFG.MAX_MULT, G.mult + 1); G.multT = 6; G.closeCalls++;
  G.slowmoT = CFG.CLOSE_CALL_SLOWMO; trail.material.opacity = 0.9;
  Audio.closeCall(); vibrate(25);
  popup(`CLOSE CALL! x${G.mult}`, '#ff2bd6', 46);
  $('vignette').style.opacity = 1; setTimeout(() => { $('vignette').style.opacity = 0; }, 450);
  questProgress('close', 1);
  if (G.mult >= 5) unlock('mult5');
  if (G.lives === 1) unlock('miracle');
}

/* ---------- Rapimento completato ---------- */
function collect(c) {
  const panic = G.panicT > 0 ? 2 : 1;
  let n = 0, pts = 0, label = '', color = '#00ff88';
  if (c.type === 'golden') {
    n = 5; pts = 500; G.golden++; S.goldenStock++; S.totalGolden++; questProgress('golden', 1); Audio.moo('gold'); label = '+5 🐄 DORATA!'; color = '#ffd23f';
    grantPower(); if (G.golden >= 5) unlock('gold5');
  } else if (c.type === 'cyborg') {
    G.cows = Math.max(0, G.cows - 3); G.score = Math.max(0, G.score - 300); G.mult = 1; G.beamDisabledT = 2.2;
    Audio.zap(); vibrate([30, 30, 30]); document.body.classList.add('glitch'); setTimeout(() => document.body.classList.remove('glitch'), 1500);
    popup('⚠ MUCCA CYBORG! −3 🐄', '#ff3355', 46); unlock('cyborg'); updateHUD(true); return;
  } else if (c.type === 'bull') { n = 2; pts = 200; Audio.moo('bull'); label = '+2 🐂 TORO!'; }
  else { n = 1; pts = 100; Audio.moo('std'); label = '+1 🐄'; }
  n *= panic; pts *= G.mult * panic;
  G.cows += n; G.score += pts; questProgress('cows', n);
  popup(`${label}${panic > 1 ? ' x2' : ''}`, color, 52);
  if (S.totalCows + G.cows >= 1) unlock('first');
  if (S.totalCows + G.cows >= 100) unlock('serial');
  if (S.totalCows + G.cows >= 1000) unlock('herd');
  updateHUD(true);
}
function grantPower() {
  const p = pick(['turbo', 'magnet', 'shield']);
  if (p === 'shield') { G.shields++; popup('BONUS: +1 SCUDO 🛡️', '#22e6ff', 36); }
  else { G.power = p; G.powerT = 8; popup(p === 'turbo' ? 'BONUS: SUPER RAGGIO ⚡' : 'BONUS: CALAMITA 🧲', '#ffd23f', 36); }
  Audio.powerup();
}

/* ---------- Panic Fever ---------- */
function startPanic() {
  G.panicT = CFG.PANIC_DURATION; G.panicRainT = 0; G.panicSurvived = true;
  Audio.alarm(); Audio.setPanicMusic(true); vibrate([80, 60, 80]);
  $('panicTint').style.opacity = 1;
}
function endPanic() {
  Audio.setPanicMusic(false); $('panicTint').style.opacity = 0; hideBanner();
  if (G.lives > 0) { unlock('panic'); questProgress('panic', 1); popup('PANIC FEVER SUPERATA!', '#ffd23f', 40); }
  G.panicCD = rand(40, 70);
}

/* ---------- Update principale ---------- */
const _col = new THREE.Color();
function updateGame(dtReal) {
  const playing = G.state === 'playing';
  // Bullet-time per le Close Call (in tempo reale)
  if (G.slowmoT > 0) G.slowmoT -= dtReal;
  G.timeScale = lerp(G.timeScale, G.slowmoT > 0 ? 0.33 : 1, 1 - Math.exp(-dtReal * 14));
  const dt = dtReal * G.timeScale;
  G.t += dt;

  // --- Movimento laterale fluido (lerp) ---
  const tx = laneX(G.lane);
  G.ufoX += (tx - G.ufoX) * (1 - Math.exp(-dtReal * Math.max(G.timeScale, 0.6) * 11));

  // --- Raggio ---
  let held = playing && keysDown.beam;
  if (held && !G.beamWasHeld && isFinite(G.beamUses)) { // modalità energia: consuma un utilizzo
    if (G.beamUses > 0) { G.beamUses--; G.beamUseT = 3.5; } else { popup('ENERGIA ESAURITA', '#ff3355', 60); }
  }
  G.beamWasHeld = held;
  if (isFinite(G.beamUses)) { if (G.beamUseT > 0) G.beamUseT -= dt; else held = false; }
  if (G.beamDisabledT > 0) { G.beamDisabledT -= dt; held = false; }
  G.beamOn = held;
  G.ufoY = lerp(G.ufoY, G.beamOn ? CFG.UFO_Y_BEAM : CFG.UFO_Y_CRUISE, 1 - Math.exp(-dt * 7));

  // --- Velocità del mondo ---
  const ramp = G.mode === 'endless' ? Math.min(14, G.distance / 260) : 0;
  const panicBoost = G.panicT > 0 ? 1.15 : 1;
  G.worldSlow = lerp(G.worldSlow, G.locked ? CFG.LOCK_SLOW : 1, 1 - Math.exp(-dt * 5));
  const speed = G.state === 'countdown' ? 10 : (G.baseSpeed + ramp) * panicBoost;
  G.scrollSpeed = speed * G.worldSlow;
  const dz = G.scrollSpeed * dt;
  if (playing) { G.distance += dz; G.score += dz * G.mult * (G.panicT > 0 ? 2 : 1); questProgress('dist', dz); }
  scrollWorld(dz);
  if (rain.visible) updateRain(dt, dz);

  if (G.state === 'countdown') {
    G.countdown -= dtReal;
    const n = Math.ceil(G.countdown - 0.2);
    const cd = $('countdown'); cd.classList.remove('hidden'); cd.textContent = n > 0 ? n : 'VIA!';
    if (G.countdown <= 0) { cd.classList.add('hidden'); G.state = 'playing'; }
  }

  if (playing) {
    // --- Spawn basati sulla distanza ---
    while (G.distance >= G.nextVeh) { spawnVehicle(); G.nextVeh += rand(16, 32) / (G.density * (G.panicT > 0 ? 1.3 : 1)) * (G.weather === 'meteor' ? 1.6 : 1); }
    while (G.distance >= G.nextCow) { spawnCow(); G.nextCow += rand(18, 32); }
    // --- Panic Fever ---
    if (G.panicT > 0) {
      G.panicT -= dt; G.panicRainT -= dt;
      if (G.panicRainT <= 0) { spawnCow(true); G.panicRainT = 0.38; }
      showBanner(`🔥 PANIC FEVER 🔥 ${Math.ceil(G.panicT)}s<br><small>auto x2 · bonus x2</small>`, 'panic', 0.3);
      if (G.panicT <= 0) endPanic();
    } else if (G.distance > 300 && !G.challenge) {
      G.panicCD -= dt; if (G.panicCD <= 0) startPanic();
    }
    // --- Meteo dinamico (modalità infinita) ---
    if (G.mode === 'endless' && G.distance > G.weatherNext) {
      G.weatherNext += 900; setWeather(pick(['clear', 'fog', 'storm', 'meteor'].filter(w => w !== G.weather)));
      showBanner(`${WEATHER[G.weather].icon} ${WEATHER[G.weather].name}`, 'info', 2.5);
    }
    if (G.weather === 'storm') updateLightning(dt);
    if (G.weather === 'meteor') { G.meteorT -= dt; if (G.meteorT <= 0) { spawnDirectMeteor(); G.meteorT = rand(2.6, 4.6); } }
    // --- Timer vari ---
    if (G.invulnT > 0) G.invulnT -= dt;
    if (G.powerT > 0) { G.powerT -= dt; if (G.powerT <= 0) G.power = null; }
    if (G.mult > 1) { G.multT -= dt; if (G.multT <= 0) { G.mult--; G.multT = 4; } }
    // --- Fine livello ---
    if (G.distance >= G.goalDist) endLevel();
  }
  updateHazards(dt);
  updateVehicles(dt, playing);
  updateCows(dt, playing);
  updateUFOVisual(dt, dtReal);
  updateAtmosphere(dtReal);
  updateCamera(dtReal);
  if (playing) updateHUD();
}

function updateVehicles(dt, playing) {
  for (let i = vehicles.length - 1; i >= 0; i--) {
    const v = vehicles[i];
    v.prevZ = v.z; v.z += relSpeed(v) * dt; v.t += dt;
    v.group.position.set(v.x, 0, v.z);
    if (v.group.userData.beacon) v.group.userData.beacon.material.opacity = (Math.sin(v.t * 10) > 0) ? 0.9 : 0.1;
    if (v.group.userData.glow) v.group.userData.glow.material.opacity = 0.6 + Math.sin(v.t * 13) * 0.25;
    if (playing && !v.hit && aabbHit(v)) { v.hit = true; damage(v.kind === 'rock' ? 'meteor' : 'car'); }
    // Close Call: il veicolo supera l'UFO senza colpirlo, passandoci accanto
    if (playing && !v.hit && v.prevZ < 0 && v.z >= 0) {
      const dx = Math.abs(v.x - G.ufoX);
      if (dx > 1.2 && dx < 4.3 && (G.beamOn || v.tall)) closeCall(v);
    }
    // Le mucche si scansano dai veicoli
    for (const c of cows) if (c.state === 'idle' && Math.abs(c.x - v.x) < 1.6 && Math.abs(c.z - v.z) < v.len / 2 + 1.4) { c.state = 'hop'; c.hopX = c.x < 0 ? -5.6 : c.x > 0 ? 5.6 : pick([-5.6, 5.6]); c.vy = 6; }
    if (v.z > CFG.DESPAWN_Z + v.len || v.z < CFG.SPAWN_Z - 60) { scene.remove(v.group); vehicles.splice(i, 1); }
  }
}

function updateCows(dt, playing) {
  const need = G.power === 'turbo' ? 0.3 : abductTime() * (G.panicT > 0 ? 0.6 : 1);
  const lockR = G.power === 'magnet' ? 4.6 : 1.35;
  // Aggancio di una nuova mucca
  if (playing && G.beamOn && !G.locked) {
    let best = null;
    for (const c of cows) {
      if (!(c.state === 'idle' || c.state === 'charge' || (c.state === 'fall' && c.y < 3))) continue;
      if (Math.abs(c.x - G.ufoX) < lockR && c.z > -2.8 && c.z < 1.8 && (!best || c.z > best.z)) best = c;
    }
    if (best) { G.locked = best; best.state = 'locked'; Audio.whoosh(); }
  }
  if (G.locked && (!G.beamOn || !playing)) releaseLock();
  let progress = 0;
  for (let i = cows.length - 1; i >= 0; i--) {
    const c = cows[i]; c.t += dt;
    const p = c.parts;
    switch (c.state) {
      case 'idle':
        c.z += G.scrollSpeed * dt;
        p.head.rotation.x = Math.sin(c.t * 2.2) * 0.25 + 0.25; // bruca
        p.tail.rotation.z = Math.sin(c.t * 5) * 0.4;
        break;
      case 'charge': // toro che corre contromano e salta
        c.z += (G.scrollSpeed + 9) * dt; c.y = Math.abs(Math.sin(c.t * 5)) * 1.8;
        p.legs.forEach((l, k) => l.rotation.x = Math.sin(c.t * 18 + k * 1.6) * 0.6);
        if (playing && Math.abs(c.z) < 1.2 && Math.abs(c.x - G.ufoX) < 1.6 && (c.y > 1.0 || G.beamOn) && !c.hitDone) { c.hitDone = true; damage('bull'); }
        break;
      case 'hop':
        c.z += G.scrollSpeed * dt; c.x = lerp(c.x, c.hopX, 1 - Math.exp(-dt * 6)); c.vy -= 22 * dt; c.y = Math.max(0, c.y + c.vy * dt);
        if (c.y === 0 && Math.abs(c.x - c.hopX) < 0.1) c.state = 'shoulder';
        break;
      case 'shoulder': c.z += G.scrollSpeed * dt; p.head.rotation.x = Math.sin(c.t * 2.2) * 0.25 + 0.25; break;
      case 'fall':
        c.z += G.scrollSpeed * dt; c.vy -= 20 * dt; c.y = Math.max(0, c.y + c.vy * dt);
        c.group.rotation.x *= 0.9;
        if (c.y === 0) { c.state = c.type === 'bull' ? 'charge' : 'idle'; c.prog = Math.max(0, c.prog - 0.3); }
        break;
      case 'locked':
        c.x = lerp(c.x, G.ufoX, 1 - Math.exp(-dt * 6)); c.z = lerp(c.z, 0, 1 - Math.exp(-dt * 5));
        c.prog += dt / need; progress = c.prog;
        c.y = lerp(c.y, 0.3 + c.prog * 1.5, 1 - Math.exp(-dt * 8));
        c.rotY += dt * 2.5; c.group.rotation.x = Math.sin(c.t * 7) * 0.12;
        p.legs.forEach((l, k) => l.rotation.x = Math.sin(c.t * 14 + k) * 0.5); // scalcia
        if (c.prog >= 1) { c.state = 'lifting'; c.lift = 0; G.locked = null; }
        break;
      case 'lifting': // risucchio finale: rotazione + rimpicciolimento
        c.lift += dt / 0.55; c.x = lerp(c.x, G.ufoX, 0.3);
        c.y = lerp(1.8, G.ufoY - 0.2, c.lift); c.rotY += dt * 16; c.scale = 0.92 * (1 - c.lift * 0.95);
        if (c.lift >= 1) { collect(c); scene.remove(c.group); cows.splice(i, 1); continue; }
        break;
    }
    c.group.position.set(c.x, c.y, c.z); c.group.rotation.y = c.rotY; c.group.scale.setScalar(Math.max(0.01, c.scale));
    if (c.type === 'cyborg') p.extra.forEach(l => { if (l.material) l.material.opacity = Math.random() < 0.15 ? 0.1 : 0.6; });
    if (c.z > CFG.DESPAWN_Z) { scene.remove(c.group); cows.splice(i, 1); }
  }
  G.lockProgress = G.locked ? clamp(progress, 0, 1) : 0;
}

/* ---------- Fulmini e meteore ---------- */
function updateLightning(dt) {
  G.lightT -= dt; G.skyFlashT -= dt;
  if (G.skyFlashT <= 0) { flashDOM('flash', 0.35, 0.25); flashLight.intensity = 3; G.skyFlashT = rand(4, 9); }
  if (G.lightT <= 0) {
    const lane = Math.random() < 0.6 ? G.lane : (Math.random() * 3) | 0;
    const ring = makeWarning(0xfff066); ring.position.x = laneX(lane);
    hazards.push({ type: 'bolt', lane, t: 1.15, ring }); Audio.crackle();
    G.lightT = G.challenge ? rand(2.4, 4.2) : rand(3.6, 6.2);
  }
}
function spawnDirectMeteor() {
  const lane = Math.random() < 0.55 ? G.lane : (Math.random() * 3) | 0;
  const ring = makeWarning(0xff7a1a); ring.position.x = laneX(lane);
  const m = buildMeteor(); const from = new THREE.Vector3(laneX(lane) + 12, 38, -26); m.position.copy(from); scene.add(m);
  hazards.push({ type: 'meteor', lane, ring, mesh: m, from, t: 0, dur: 1.35 });
}
const _dir = new THREE.Vector3();
function updateHazards(dt) {
  if (bolt.visible) { boltMat.opacity -= dt * 5; if (boltMat.opacity <= 0) bolt.visible = false; }
  flashLight.intensity = Math.max(0, flashLight.intensity - dt * 18);
  for (let i = hazards.length - 1; i >= 0; i--) {
    const h = hazards[i];
    if (h.type === 'bolt') {
      h.t -= dt; h.ring.material.opacity = 0.4 + Math.abs(Math.sin(h.t * 18)) * 0.6; h.ring.scale.setScalar(1 + (1.15 - h.t) * 0.3);
      if (h.t <= 0) {
        makeBolt(laneX(h.lane), 0); flashDOM('flash', 0.95, 0.5); flashLight.intensity = 10; Audio.thunder(); G.shake = Math.max(G.shake, 0.3);
        if (G.state === 'playing' && Math.abs(G.ufoX - laneX(h.lane)) < 1.6) damage('lightning');
        scene.remove(h.ring); hazards.splice(i, 1);
      }
    } else if (h.type === 'meteor' || h.type === 'roadMeteor') {
      h.t += dt / h.dur; const k = Math.min(1, h.t);
      const target = h.type === 'meteor' ? _dir.set(laneX(h.lane), 0, 0) : _dir.set(laneX(h.lane), 0, h.z);
      if (h.type === 'roadMeteor') h.z += G.scrollSpeed * dt;
      h.mesh.position.lerpVectors(h.from, target, k * k);
      h.mesh.lookAt(h.from); h.mesh.rotateX(Math.PI / 2);
      if (h.ring) h.ring.material.opacity = 0.4 + Math.abs(Math.sin(h.t * 30)) * 0.6;
      if (k >= 1) {
        scene.remove(h.mesh); if (h.ring) scene.remove(h.ring);
        if (h.type === 'meteor') { Audio.impact(); G.shake = Math.max(G.shake, 0.35); flashDOM('flash', 0.4, 0.3); if (G.state === 'playing' && Math.abs(G.ufoX - laneX(h.lane)) < 1.6) damage('meteor'); }
        else addRock(h.lane, h.z);
        hazards.splice(i, 1);
      }
    }
  }
}

/* ---------- Visual dell'UFO, raggio, atmosfera, camera ---------- */
function updateUFOVisual(dt, dtReal) {
  const g = ufo.group;
  const hover = Math.sin(G.t * 2.2) * 0.12;
  g.position.set(G.ufoX, G.ufoY + hover, 0);
  g.rotation.z = (G.ufoX - laneX(G.lane)) * 0.12;
  g.rotation.y += dt * (G.beamOn ? 2.4 : 0.8);
  g.visible = !(G.invulnT > 0 && G.state === 'playing' && Math.floor(G.invulnT * 12) % 2 === 0);
  ufo.leds.forEach((l, i) => {
    const on = Math.sin(G.t * 9 - i * 0.7) > 0.3;
    l.material.emissiveIntensity = on ? 4 : 0.6;
    if (ufo.sk.rainbow) l.material.emissive.setHSL((G.t * 0.3 + i / ufo.leds.length) % 1, 1, 0.55);
  });
  // Raggio
  const bi = beamMat.uniforms.uI.value = lerp(beamMat.uniforms.uI.value, G.beamOn ? 1 : 0, 1 - Math.exp(-dt * 14));
  beamMat.uniforms.uTime.value = G.t;
  beamMat.uniforms.uColor.value.setHex(G.beamDisabledT > 0 ? 0xff3355 : 0x00ff88);
  const bh = Math.max(0.1, G.ufoY - 0.35 + hover);
  beam.visible = bi > 0.02; beam.position.set(G.ufoX, G.ufoY - 0.35 + hover, 0); beam.scale.set(1, bh, 1);
  beamPool.position.x = G.ufoX; beamPool.material.opacity = bi * (0.5 + 0.2 * Math.sin(G.t * 12));
  beamLight.position.set(G.ufoX, 1.2, 0); beamLight.intensity = bi * 9;
  particles.visible = bi > 0.05; particles.position.set(G.ufoX, 0, 0);
  if (particles.visible) updateParticles(dt, bh, G.locked ? 1 : 0);
  Audio.beam(G.beamOn, G.lockProgress || 0);
  // Scia e scudo
  trail.position.set(G.ufoX, G.ufoY, 0); trail.material.opacity = Math.max(0, trail.material.opacity - dtReal * 1.6);
  shieldBubble.position.copy(g.position); shieldBubble.material.opacity = Math.max(0, shieldBubble.material.opacity - dtReal * 1.5);
}
function updateAtmosphere(dtReal) {
  G.panicMix = lerp(G.panicMix, G.panicT > 0 ? 1 : 0, 1 - Math.exp(-dtReal * 3));
  const pm = G.panicMix, k = 1 - Math.exp(-dtReal * 2);
  scene.fog.near = lerp(scene.fog.near, G.fogNear, k); scene.fog.far = lerp(scene.fog.far, G.fogFar, k);
  _col.copy(G.fogCol).lerp(PANIC_RED, pm * 0.35); scene.fog.color.lerp(_col, k * 2);
  _col.copy(G.skyCol).lerp(PANIC_RED, pm * 0.25); scene.background.lerp(_col, k * 2);
  hemi.color.copy(HEMI_SKY).lerp(PANIC_RED, pm * 0.8);
  roadMat.emissive.setRGB(1, 1 - pm * 0.8, 1 - pm * 0.8);
  _col.copy(LAMP_COLOR).lerp(PANIC_RED, pm);
  lampMats.head.emissive.copy(_col); lampMats.cone.color.copy(_col); lampMats.pool.color.copy(_col);
}
function updateCamera(dtReal) {
  const portrait = window.innerWidth / window.innerHeight < 0.8;
  const tx = G.ufoX * (portrait ? 0.35 : 0.55);
  camera.position.x = lerp(camera.position.x, tx, 1 - Math.exp(-dtReal * 6));
  camera.position.y = portrait ? 9.2 : 7.4; camera.position.z = portrait ? 13.5 : 11.5;
  if (G.shake > 0) { camera.position.x += rand(-1, 1) * G.shake; camera.position.y += rand(-1, 1) * G.shake * 0.6; G.shake = Math.max(0, G.shake - dtReal * 1.6); }
  camera.lookAt(G.ufoX * 0.45, 1.0, -14);
}

/* ---------- Fine partita ---------- */
function gameOver() {
  G.state = 'over'; G.endReason = 'dead'; releaseLock(); keysDown.beam = false; hideBanner();
  if (G.panicT > 0) { G.panicT = 0; Audio.setPanicMusic(false); $('panicTint').style.opacity = 0; }
  setTimeout(() => renderOver(), 700);
}
function endLevel() {
  G.state = 'over'; releaseLock(); keysDown.beam = false; hideBanner();
  const ok = G.cows >= G.target;
  G.endReason = ok ? 'complete' : 'missed';
  if (G.panicT > 0) { G.panicT = 0; Audio.setPanicMusic(false); $('panicTint').style.opacity = 0; }
  if (ok) { Audio.powerup(); vibrate([40, 40, 40]); }
  renderOver();
}
function revive() {
  G.revived = true; G.lives = 1; G.invulnT = 2.5; G.state = 'countdown'; G.countdown = 2.2;
  for (const v of vehicles) if (v.z > -40) { scene.remove(v.group); v.dead = true; }
  for (let i = vehicles.length - 1; i >= 0; i--) if (vehicles[i].dead) vehicles.splice(i, 1);
  showScreen(null); updateHUD(true);
}
/* Applica i risultati: monete, record, classifica, mappa, trofei */
function finalizeRun() {
  const success = G.endReason === 'complete';
  const coins = Math.round(G.cows * coinBonus() * (G.doubled ? 2 : 1)) + (success ? 20 + (G.level ? G.level.id * 3 : 60) : 0);
  S.coins += coins; S.totalCows += G.cows;
  S.highScore = Math.max(S.highScore, Math.floor(G.score)); S.bestDistance = Math.max(S.bestDistance, Math.floor(G.distance));
  S.leaderboard.push({ name: S.pilot, score: Math.floor(G.score), cows: G.cows, dist: Math.floor(G.distance), mode: G.mode, date: Date.now() });
  S.leaderboard.sort((a, b) => b.score - a.score); S.leaderboard = S.leaderboard.slice(0, 10);
  if (G.mode === 'endless' && G.distance >= 5000) unlock('marathon');
  if (success) {
    if (!G.damageTaken) { unlock('untouch'); questProgress('nohit', 1); }
    if (G.weather === 'storm') unlock('storm'); if (G.weather === 'fog') unlock('fog'); if (G.weather === 'meteor') unlock('meteor');
    if (G.mode === 'level') {
      const id = G.level.id; S.levels[id] = Math.max(S.levels[id] || 0, G.cows);
      const s = G.level.sector;
      const all = [0, 1, 2, 3, 4].every(l => S.levels[s * 5 + l] !== undefined);
      if (all && !S.sectorsDone.includes(s)) {
        S.sectorsDone.push(s); const sk = SECTORS[s].skin; if (!S.ufoSkins.includes(sk)) S.ufoSkins.push(sk);
        unlock('sector'); if (S.sectorsDone.length >= 5) unlock('conqueror');
        G.sectorUnlocked = s;
      }
    }
    if (G.mode === 'daily') {
      const dk = dateKey(); if (S.daily.lastDone !== dk) {
        const y = new Date(); y.setDate(y.getDate() - 1);
        S.daily.streak = S.daily.lastDone === dateKey(y) ? S.daily.streak + 1 : 1; S.daily.lastDone = dk;
        S.coins += 150 + 50 * Math.min(S.daily.streak, 5); if (S.daily.streak >= 3) unlock('daily3');
      }
    }
  } else if (G.mode !== 'endless') consumeHeart();
  persist(); return coins;
}

function finish(next) {
  const coins = finalizeRun(); const res = showResults(coins);
  const lvl = G.level, mode = G.mode;
  if (next === 'menu') { goMenu(); toast(`Bottino: +${coins} 🪙`); if (res.includes('Settore completato')) modal(res + `<button class="btn" data-act="open:map">Vai alla mappa</button>`); return; }

  if (next === 'retry') { if (mode === 'level') startRun('level', { level: lvl.id }); else startRun(mode); toast(`Bottino: +${coins} 🪙`); }
}
function act(a, el) {
  Audio.init(); Audio.click();
  const [cmd, arg] = a.split(':');
  switch (cmd) {
    case 'open':
      if (arg === 'settings-pause') { showScreen('settings'); $('pnl-settings').querySelector('[data-act="open:menu"]').setAttribute('data-act', 'open:pause'); return; }
      if (arg === 'menu' && G.state !== 'menu') { goMenu(); return; }
      showScreen(arg); break;
    case 'play': startRun(arg); break;
    case 'level': startRun('level', { level: +arg }); break;
    case 'labtab': labTab = arg; renderLab(); break;
    case 'buy': { const u = UPGRADES[arg], c = u.costs[S.upgrades[arg]]; if (c !== undefined && S.coins >= c) { S.coins -= c; S.upgrades[arg]++; persist(); Audio.powerup(); } renderLab(); break; }
    case 'collect': { tickLab(); const n = Math.floor(S.lab.silo); S.coins += n; S.lab.silo -= n; persist(); Audio.coin(); toast(`+${n} 🪙 dal laboratorio`); renderLab(); break; }
    case 'breed': {
      if (S.coins < CFG.CROSSBREED_COST || S.goldenStock < 1) return;
      S.coins -= CFG.CROSSBREED_COST; S.goldenStock--;
      const k = pick(Object.keys(COW_SKINS).filter(x => x !== 'standard'));
      if (S.cowSkins.includes(k)) { S.coins += 60; toast(`🧬 Duplicato: ${COW_SKINS[k].name} — rimborso 60 🪙`); }
      else { S.cowSkins.push(k); toast(`🧬 Nuova razza: <b>${COW_SKINS[k].name}</b>!`); Audio.powerup(); }
      unlock('genetist'); if (S.cowSkins.length >= Object.keys(COW_SKINS).length) unlock('collector');
      persist(); renderLab(); break;
    }
    case 'cowskin': S.cowSkin = arg; persist(); renderLab(); break;
    case 'ufoskin': if (S.ufoSkins.includes(arg)) { S.ufoSkin = arg; persist(); setUFOSkin(arg); } if (currentScreen === 'lab') renderLab(); else toast(`Skin equipaggiata: ${UFO_SKINS[arg].name}`); break;
    case 'claim': { const q = QUEST_POOL.find(x => x.id === arg); if ((S.quests.progress[arg] || 0) >= q.goal && !S.quests.claimed[arg]) { S.quests.claimed[arg] = true; S.coins += q.reward; persist(); Audio.coin(); } showScreen(currentScreen); break; }
    case 'toggle': S.settings[arg] = !S.settings[arg]; persist(); Audio.apply(); renderSettings(); break;
    case 'quality': S.settings.quality = S.settings.quality === 'high' ? 'low' : 'high'; persist(); applyQuality(); resize(); renderSettings(); break;
    case 'reset': if (confirm('Cancellare tutti i progressi?')) { localStorage.removeItem(SAVE_KEY); S = defaultSave(); persist(); setUFOSkin('classic'); showScreen('menu'); } break;
    case 'pause': pauseGame(); break;
    case 'resume': resumeGame(); break;
    case 'quit': finishQuit(); break;
    case 'revive': AdService.showRewarded('revive', () => revive()); break;
    case 'double': AdService.showRewarded('double', () => { G.doubled = true; Audio.coin(); renderOver(); }); break;
    case 'iap': modal(`<h2>💎 Pacchetto Illimitato</h2><p>Cuori infiniti e nessuna pubblicità.</p><button class="btn pink" data-act="iapok">Acquista</button><button class="btn ghost" data-act="iapno">Annulla</button>`); break;
    case 'iapno': renderOver(); break;
    case 'iapok': toast('Acquisti non ancora attivi in questa versione'); renderOver(); break;
    case 'heartad': AdService.showRewarded('heart', () => { S.hearts = Math.min(CFG.MAX_HEARTS, S.hearts + 1); persist(); showScreen('menu'); }); break;
    case 'finish': finish(arg); break;
  }
}
function finishQuit() { // abbandono: niente monete per livelli/sfide (consuma un cuore), in Infinita si raccoglie
  if (G.mode === 'endless') { G.endReason = 'dead'; finish('menu'); return; }
  consumeHeart(); persist(); goMenu();
}
document.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.getAttribute('data-act'), el); });

function pauseGame() { if (G.state !== 'playing' && G.state !== 'countdown') return; G.prevState = G.state; G.state = 'paused'; keysDown.beam = false; Audio.beam(false, 0); showScreen('pause'); }
function resumeGame() { if (G.state !== 'paused') return; showScreen(null); G.state = 'countdown'; G.countdown = 1.2; }

/* =====================================================================
   8. INPUT & MAIN LOOP
   ===================================================================== */
function moveLane(d) { if (G.state !== 'playing' && G.state !== 'countdown') return; const n = clamp(G.lane + d, 0, 2); if (n !== G.lane) { G.lane = n; Audio.whoosh(); } }
window.addEventListener('keydown', (e) => {
  Audio.init();
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') { moveLane(-1); e.preventDefault(); }
  else if (k === 'arrowright' || k === 'd') { moveLane(1); e.preventDefault(); }
  else if (k === ' ' || k === 'spacebar' || k === 'arrowup' || k === 'w') { keysDown.beam = true; e.preventDefault(); }
  else if (k === 'p' || k === 'escape') { G.state === 'paused' ? resumeGame() : pauseGame(); }
});
window.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k === ' ' || k === 'spacebar' || k === 'arrowup' || k === 'w') keysDown.beam = false; });

/* Touch: pulsanti + swipe laterale sul canvas */
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');
function holdBtn(id, down, up) {
  const el = $(id);
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); Audio.init(); el.classList.add('down'); try { el.setPointerCapture(e.pointerId); } catch (_) { } down(); });
  const end = (e) => { el.classList.remove('down'); up && up(); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
}
holdBtn('tLeft', () => moveLane(-1)); holdBtn('tRight', () => moveLane(1));
holdBtn('tAbduct', () => { keysDown.beam = true; vibrate(10); }, () => { keysDown.beam = false; });
let swipe = null;
renderer.domElement.addEventListener('pointerdown', (e) => { Audio.init(); swipe = { x: e.clientX, y: e.clientY, used: false }; });
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!swipe || swipe.used) return; const dx = e.clientX - swipe.x;
  if (Math.abs(dx) > 35) { moveLane(dx > 0 ? 1 : -1); swipe.used = true; }
});
window.addEventListener('pointerup', () => { swipe = null; });

/* Pausa automatica quando l'app va in background */
document.addEventListener('visibilitychange', () => { if (document.hidden) { pauseGame(); Audio.suspend(); } else Audio.resume(); });
/* Tasto Indietro Android (Capacitor App plugin, se presente) */
const CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
if (CapApp) CapApp.addListener('backButton', () => {
  if (G.state === 'playing' || G.state === 'countdown') pauseGame();
  else if (G.state === 'paused') resumeGame();
  else if (currentScreen === 'over') act('finish:menu');
  else if (currentScreen && currentScreen !== 'menu') act(G.state === 'menu' ? 'open:menu' : 'open:pause');
  else CapApp.exitApp();
});

/* Main loop */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dtReal = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.state === 'paused' || G.freeze) { renderer.render(scene, camera); return; }
  if (G.state === 'menu') { G.scrollSpeed = 9; G.t += dtReal; scrollWorld(9 * dtReal); updateUFOVisual(dtReal, dtReal); updateAtmosphere(dtReal); updateCamera(dtReal); updateHazards(dtReal); }
  else if (G.state === 'over') { G.t += dtReal; updateUFOVisual(dtReal, dtReal); updateCamera(dtReal); }
  else updateGame(dtReal);
  renderer.render(scene, camera);
}
/* Timer del menu (cuori e silo) */
setInterval(() => { if (currentScreen === 'menu' && G.state === 'menu' && heartsActive()) { const tb = document.querySelector('#topbar span:last-child'); if (tb) tb.innerHTML = heartsHTML(); } }, 1000);

camera.position.set(0, 7.4, 11.5);
showScreen('menu');
$('loading').remove();
requestAnimationFrame(frame);
window.__game = { G, get S() { return S; }, startRun, act, updateGame, cows, vehicles, spawnCow, spawnVehicle, setWeather, renderer, scene, camera, buildCow, beam, beamMat, beamPool, particles, updateParticles, get ufo() { return ufo; }, setUFOSkin, THREE }; // hook di debug/test
</script>
